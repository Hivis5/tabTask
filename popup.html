<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabTasks</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="src/Assests/tabTaskLogo.png" alt="TabTasks Logo" class="app-logo">
                <h1>TabTasks</h1>
            </div>
            <p class="subtitle" id="current-domain">Loading...</p>
        </header>

        <form id="add-task-form" class="input-group">
            <input type="text" id="task-input" placeholder="Add a task for this page..." autocomplete="off">
            <div class="actions">
                <button type="button" id="type-toggle" class="type-toggle" title="Toggle Task Scope">
                    <span class="scope-icon icon-url active" title="This Page">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                    </span>
                    <span class="scope-icon icon-global" title="Global">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                            </path>
                        </svg>
                    </span>
                </button>
                <button type="submit" class="submit-btn" title="Add Task">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </form>

        <div class="task-list-container">
            <ul id="task-list">
                <!-- Tasks will be injected here -->
            </ul>
        </div>
        <footer class="app-footer">
            Built by <a href="https://www.linkedin.com/in/hiteshvishal/" target="_blank"
                rel="noopener noreferrer">Hivy</a>
        </footer>
    </div>
    <script src="dist/popup.js"></script>
</body>

</html>
